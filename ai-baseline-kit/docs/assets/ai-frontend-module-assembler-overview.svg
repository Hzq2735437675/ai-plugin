<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI 前端模块装配系统说明图</title>
  <desc id="desc">展示从自然语言和产品文档进入需求确认、架构计划、受控执行、自动测试、工程门禁，并支持项目 A 和 B 模块组合到项目 C 的完整闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF4FC"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#337ECC"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67C23A"/>
      <stop offset="1" stop-color="#529B2E"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6A23C"/>
      <stop offset="1" stop-color="#B88230"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1D3B5F" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#409EFF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67C23A"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E6A23C"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 48px; font-weight: 700; fill: #303133; letter-spacing: 1px; }
      .subtitle { font-size: 21px; fill: #606266; }
      .section { font-size: 22px; font-weight: 700; fill: #303133; }
      .box-title { font-size: 22px; font-weight: 700; fill: #303133; }
      .box-body { font-size: 16px; fill: #606266; }
      .white-title { font-size: 23px; font-weight: 700; fill: #FFFFFF; }
      .white-body { font-size: 16px; fill: #F4F8FF; }
      .badge { font-size: 14px; font-weight: 700; fill: #409EFF; }
      .small { font-size: 14px; fill: #909399; }
      .arrow { fill: none; stroke: #409EFF; stroke-width: 4; marker-end: url(#arrowBlue); }
      .arrow-green { fill: none; stroke: #67C23A; stroke-width: 4; marker-end: url(#arrowGreen); }
      .arrow-orange { fill: none; stroke: #E6A23C; stroke-width: 4; marker-end: url(#arrowOrange); }
      .foundation-link { fill: none; stroke: #A8ABB2; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1740" cy="65" r="220" fill="#409EFF" opacity="0.035"/>
  <circle cx="125" cy="1035" r="260" fill="#67C23A" opacity="0.035"/>

  <g class="font">
    <text x="90" y="78" class="title">AI 前端模块装配系统</text>
    <text x="92" y="116" class="subtitle">自然语言驱动 · 模块边界约束 · 自动验收 · 同栈模块迁移组合 · 整包可替换升级</text>
    <g transform="translate(1602,44)">
      <rect width="228" height="44" rx="22" fill="#ECF5FF" stroke="#B3D8FF"/>
      <text x="114" y="29" text-anchor="middle" class="badge">AI FRONTEND ASSEMBLER</text>
    </g>

    <text x="90" y="172" class="section">01 需求到交付的受控闭环</text>

    <!-- Input -->
    <g transform="translate(90,210)" filter="url(#shadow)">
      <rect width="235" height="185" rx="22" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="2"/>
      <rect x="20" y="20" width="46" height="46" rx="13" fill="#ECF5FF"/>
      <path d="M34 34h18M34 42h18M34 50h12" stroke="#409EFF" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="51" class="box-title">需求输入</text>
      <text x="24" y="96" class="box-body">自然语言 / 大白话</text>
      <text x="24" y="125" class="box-body">产品文档 / API 文档</text>
      <text x="24" y="154" class="box-body">Feature Spec / 组合需求</text>
    </g>

    <!-- Entrypoint -->
    <g transform="translate(365,210)" filter="url(#shadow)">
      <rect width="235" height="185" rx="22" fill="url(#primary)"/>
      <circle cx="43" cy="43" r="22" fill="#FFFFFF" opacity="0.18"/>
      <path d="M32 43h22M47 34l9 9-9 9" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="51" class="white-title">AI 统一接入</text>
      <text x="24" y="96" class="white-body">AGENTS.md</text>
      <text x="24" y="125" class="white-body">CLAUDE.md</text>
      <text x="24" y="154" class="white-body">ai-run 统一命令入口</text>
    </g>

    <!-- Requirement compiler -->
    <g transform="translate(640,210)" filter="url(#shadow)">
      <rect width="260" height="185" rx="22" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="2"/>
      <rect x="20" y="20" width="46" height="46" rx="13" fill="#ECF5FF"/>
      <circle cx="43" cy="43" r="11" fill="none" stroke="#409EFF" stroke-width="3"/>
      <path d="M51 51l9 9" stroke="#409EFF" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="51" class="box-title">需求编译</text>
      <text x="24" y="96" class="box-body">文档标准化</text>
      <text x="24" y="125" class="box-body">Feature Spec</text>
      <text x="24" y="154" class="box-body">事实 / 推断 / unknown</text>
    </g>

    <!-- Question gate -->
    <g transform="translate(940,210)" filter="url(#shadow)">
      <rect width="245" height="185" rx="22" fill="#FDF6EC" stroke="#F3D19E" stroke-width="2"/>
      <rect x="20" y="20" width="46" height="46" rx="13" fill="#FAECD8"/>
      <text x="43" y="54" text-anchor="middle" font-size="31" font-weight="700" fill="#E6A23C">?</text>
      <text x="82" y="51" class="box-title">确认门</text>
      <text x="24" y="96" class="box-body">blocking question</text>
      <text x="24" y="125" class="box-body">权限 · API · 路由</text>
      <text x="24" y="154" class="box-body">不确定项先问用户</text>
    </g>

    <!-- Plan -->
    <g transform="translate(1225,210)" filter="url(#shadow)">
      <rect width="250" height="185" rx="22" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="2"/>
      <rect x="20" y="20" width="46" height="46" rx="13" fill="#ECF5FF"/>
      <path d="M32 35h22v18H32zM37 40h12M37 46h12" fill="none" stroke="#409EFF" stroke-width="2.5"/>
      <text x="82" y="51" class="box-title">架构计划</text>
      <text x="24" y="96" class="box-body">模块归属</text>
      <text x="24" y="125" class="box-body">Change Plan</text>
      <text x="24" y="154" class="box-body">文件修改白名单</text>
    </g>

    <!-- Execute -->
    <g transform="translate(1515,210)" filter="url(#shadow)">
      <rect width="315" height="185" rx="22" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="2"/>
      <rect x="20" y="20" width="46" height="46" rx="13" fill="#ECF5FF"/>
      <path d="M31 44l8 8 17-19" fill="none" stroke="#409EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="51" class="box-title">受控执行</text>
      <text x="24" y="96" class="box-body">模块契约 · 代码生成</text>
      <text x="24" y="125" class="box-body">主题 · 路由 · 权限 · i18n</text>
      <text x="24" y="154" class="box-body">事务记录 · 失败回滚</text>
    </g>

    <!-- arrows row 1 -->
    <path d="M325 302H353" class="arrow"/>
    <path d="M600 302H628" class="arrow"/>
    <path d="M900 302H928" class="arrow-orange"/>
    <path d="M1185 302H1213" class="arrow"/>
    <path d="M1475 302H1503" class="arrow"/>

    <!-- Confirmation loop -->
    <path d="M1062 395V435H770V407" class="arrow-orange"/>
    <rect x="896" y="416" width="146" height="32" rx="16" fill="#FDF6EC" stroke="#F3D19E"/>
    <text x="969" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#B88230">用户回答后继续</text>

    <!-- Validation row -->
    <g transform="translate(640,485)" filter="url(#shadow)">
      <rect width="310" height="170" rx="22" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="2"/>
      <text x="26" y="45" class="box-title">自动验收</text>
      <text x="26" y="81" class="box-body">Vitest · Component Tests</text>
      <text x="26" y="110" class="box-body">API Mock · 权限 · 页面状态</text>
      <text x="26" y="139" class="box-body">Playwright E2E 骨架</text>
    </g>

    <g transform="translate(1000,485)" filter="url(#shadow)">
      <rect width="350" height="170" rx="22" fill="#FFFFFF" stroke="#C2E7B0" stroke-width="2"/>
      <text x="26" y="45" class="box-title">工程门禁</text>
      <text x="26" y="81" class="box-body">AST 边界 · Baseline</text>
      <text x="26" y="110" class="box-body">Typecheck · Lint · Test · Build</text>
      <text x="26" y="139" class="box-body">CI Gate：交付前必须通过</text>
    </g>

    <g transform="translate(1400,485)" filter="url(#shadow)">
      <rect width="430" height="170" rx="22" fill="url(#success)"/>
      <text x="28" y="45" class="white-title">结构化前端项目</text>
      <text x="28" y="82" class="white-body">shell · shared · modules</text>
      <text x="28" y="111" class="white-body">theme · i18n · tests · assets</text>
      <text x="28" y="140" class="white-body">清晰边界 · 可拆解 · 可组合 · 可审计</text>
    </g>

    <path d="M1670 395V455H795V473" class="arrow"/>
    <path d="M950 570H988" class="arrow"/>
    <path d="M1350 570H1388" class="arrow-green"/>

    <!-- Fail repair loop -->
    <path d="M1175 655V700H795V667" class="arrow-orange"/>
    <rect x="923" y="681" width="238" height="34" rx="17" fill="#FEF0F0" stroke="#FAB6B6"/>
    <text x="1042" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#C45656">失败：限定范围修复或事务回滚</text>

    <!-- Composition section -->
    <text x="90" y="765" class="section">02 跨项目模块迁移与组合（同技术栈）</text>

    <g transform="translate(90,800)">
      <rect width="245" height="105" rx="18" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="2"/>
      <text x="24" y="42" class="box-title">项目 A / 项目 B</text>
      <text x="24" y="75" class="box-body">按模块边界开发的候选能力</text>
    </g>
    <g transform="translate(390,800)">
      <rect width="250" height="105" rx="18" fill="#ECF5FF" stroke="#B3D8FF" stroke-width="2"/>
      <text x="24" y="42" class="box-title">Discover / Export</text>
      <text x="24" y="75" class="box-body">模块发现与标准 Bundle</text>
    </g>
    <g transform="translate(695,800)">
      <rect width="360" height="105" rx="18" fill="#FDF6EC" stroke="#F3D19E" stroke-width="2"/>
      <text x="24" y="42" class="box-title">Compatibility Check</text>
      <text x="24" y="75" class="box-body">技术栈 · shared · 依赖 · 主题 · 权限</text>
    </g>
    <g transform="translate(1110,800)">
      <rect width="275" height="105" rx="18" fill="#ECF5FF" stroke="#B3D8FF" stroke-width="2"/>
      <text x="24" y="42" class="box-title">Import / Compose</text>
      <text x="24" y="75" class="box-body">事务导入与 shell 装配</text>
    </g>
    <g transform="translate(1440,800)">
      <rect width="390" height="105" rx="18" fill="#F0F9EB" stroke="#B3E19D" stroke-width="2"/>
      <text x="24" y="42" class="box-title">项目 C + 组合清单</text>
      <text x="24" y="75" class="box-body">路由 · 权限 · 主题 · i18n 显式合并</text>
    </g>
    <path d="M335 852H378" class="arrow"/>
    <path d="M640 852H683" class="arrow-orange"/>
    <path d="M1055 852H1098" class="arrow"/>
    <path d="M1385 852H1428" class="arrow-green"/>

    <!-- Foundation -->
    <g transform="translate(90,955)">
      <rect width="1740" height="76" rx="20" fill="#FFFFFF" stroke="#DCDFE6" stroke-width="2"/>
      <rect width="250" height="76" rx="20" fill="#303133"/>
      <text x="125" y="47" text-anchor="middle" class="white-title">统一基础契约层</text>
      <text x="300" y="47" class="box-body">baseline rules</text>
      <circle cx="470" cy="39" r="4" fill="#C0C4CC"/>
      <text x="500" y="47" class="box-body">project scheme</text>
      <circle cx="685" cy="39" r="4" fill="#C0C4CC"/>
      <text x="715" y="47" class="box-body">schemas</text>
      <circle cx="825" cy="39" r="4" fill="#C0C4CC"/>
      <text x="855" y="47" class="box-body">module contract</text>
      <circle cx="1055" cy="39" r="4" fill="#C0C4CC"/>
      <text x="1085" y="47" class="box-body">.ai-frontend-assembler</text>
      <circle cx="1335" cy="39" r="4" fill="#C0C4CC"/>
      <text x="1365" y="47" class="box-body">外置项目状态 · 整包替换升级</text>
    </g>

    <text x="1830" y="1058" text-anchor="end" class="small">适用版本 v0.10.0 · 2026-07-27</text>
  </g>
</svg>
