project:
  purpose: 面向 AI 可读、复制优先、可裁剪、可审计、可复用、同技术栈模块可迁移的通用项目基线。
  stack:
    portability_scope: same-technology-stack-only
    framework: project-defined
    ui_library: project-defined
    language: project-defined
    build_tool: project-defined
    router: project-defined
    state_manager: project-defined
    i18n: project-defined
    style_solution: project-defined
  ownership:
    shell_layer: project-defined
    shared_layer: project-defined
    module_layer: project-defined

project_scheme:
  purpose: 项目说明书和项目地图；供 AI 读取当前项目真实结构、装配入口、模块能力和迁移边界。
  path_mode:
    embedded_baseline_root: ai-baseline-kit
    package_reference_scheme: ai-baseline-kit/docs/project-scheme.yml
    project_state_root: .ai-frontend-assembler
    scheme_location: .ai-frontend-assembler/project-scheme.yml
    project_root: ai-baseline-kit 的父目录
  embedded_package_rules:
    - ai-baseline-kit 作为完整规范包植入项目根目录，不把 docs、skills、scripts 抽散到业务项目根目录。
    - 业务改动默认只发生在 project_root，不修改 ai-baseline-kit；只有维护规范包时才改 baseline_root。
    - 项目根 AGENTS.md 和 CLAUDE.md 应包含 ai-baseline 强入口约束；缺失时创建，已有但不完整时追加受控段落，不覆盖原内容。
    - 多 AI 自动发现入口当前仅限 AGENTS.md 和 CLAUDE.md，不创建 Cursor、Copilot 或其他工具专属文件。
    - 能力发现必须先读取 capabilities/index.json 轻量索引，只解析索引显式指向且本次命中的 capabilities/manifests/*.json；禁止目录扫描、动态注册或执行 manifest 中的脚本。
    - AI 必须按 capability-route 返回的 load.stages 顺序读取存在文件；load.baselineFiles 仅用于兼容旧调用方，不得借兼容字段退化为全量 Skill 加载。
    - 目标项目专属状态必须写入 .ai-frontend-assembler/，不得写回可替换的 ai-baseline-kit/ 包目录。
    - 不要自动向目标项目 .gitignore 追加 ai-baseline-kit/；规范包变化应允许在 Git 中显示，便于审计、同步和提交。
    - 首次 activate/init 必须自动建立构建隔离：ai-baseline-kit/.npmignore 与 .ai-frontend-assembler/.npmignore 使用嵌套排除，根 .dockerignore / .vercelignore 使用受控规则块，已有 .npmignore / .gcloudignore / .cfignore 则安全追加受控规则。
    - 目标项目存在 scripts.build 时，首次接入必须幂等接入 scripts.postbuild 构建产物守卫；守卫只允许清理已识别输出目录内的 ai-baseline-kit/ 与 .ai-frontend-assembler/，不得删除源码目录。
    - 自定义构建输出目录无法自动识别时，必须通过 --output 或 AI_BASELINE_OUTPUT_DIRS 显式声明，并在 Gate 中执行 build-artifact-guard --check。
    - 业务源码禁止 import/require ai-baseline-kit/ 或 .ai-frontend-assembler/；否则构建器可能将能力包内容内联进前端产物，baseline-check 必须报错。
    - 如果目标项目 .gitignore 已忽略 ai-baseline-kit/，需要显示规范包变化时应由开发者显式移除该忽略规则。
  status:
    current_branch: generated_or_bootstrapped_per_project
    generation_mode: ai_bootstrap_first_then_manual_review
    automation_mode: requirement_spec_plan_generate_validate_closed_loop
  bootstrap_rules:
    - 当 .ai-frontend-assembler/project-scheme.yml 不存在时，先运行 skills/project-scheme-bootstrap/SKILL.md
    - 新项目优先从用户需求中提取技术栈、目标端、UI 库和业务类型；旧项目优先从 package manifest、框架配置、路由入口、状态入口、i18n 入口、API client、目录结构和已有模块推断
    - 空项目且用户未指定技术栈时，使用 stack-profiles.yml 的 default_new_frontend_profile；只有用户需求与默认方案冲突或关键信息不足时才提出最少确认问题
    - 无法可靠推断的字段保留为 unknown，并在 required_questions 中列出最少问题
    - 不因为缺少 scheme 直接开始业务改动
    - 完成 0.10.0+ 接入后，升级通过直接覆盖整目录 ai-baseline-kit/ 完成；统一入口 ai-run activate 自动路由首次 bootstrap 或安全 upgrade，必须保留 .ai-frontend-assembler/。
  required_when_enabled:
    - current tech stack summary
    - shell/shared/modules map
    - module manifest index
    - assembler entrypoints
    - api client location
    - permission context
    - i18n entrypoints
    - store entrypoints
    - base components location
    - shared-core location
    - modules portability summary
    - scheme version and update source
  update_rules:
    - 结构变更后必须更新 scheme
    - 模块新增、删除、迁移或重命名后必须更新 scheme
    - 装配入口变化后必须更新 scheme
    - 当 baseline 未完成时，不生成执行层自动化脚本驱动的 scheme

layers:
  shell:
    scope:
      - 应用启动
      - 全局布局或壳层
      - 全局主题
      - 全局样式
      - 全局路由装配
      - 全局状态
      - 全局指令
      - 全局文案
      - 无明确业务域归属的基础页面
    must_not:
      - 依赖模块私有实现细节
      - 承载应属于 shared 或 modules 的业务逻辑
  shared:
    scope:
      - 跨域复用组件
      - 共享 hooks 与 utils
      - 共享 types
      - 共享状态
      - 共享文案
      - 明确跨域复用但不属于基础层的页面
    must_not:
      - 依赖某个具体模块
      - 承载基础入口页或兜底页
  modules:
    scope:
      - 权限或业务域专属页面
      - 路由
      - 菜单
      - 访问控制
      - API
      - 模块类型
      - 模块状态
      - 模块指令
      - 模块文案
      - 模块样式
    must_not:
      - 直接导入另一个模块
      - 暴露隐式跨模块耦合

directory_conventions:
  roots:
    shell_root: project-defined
    shared_root: project-defined
    modules_root: project-defined
    base_components_root: project-defined
    common_assets_root: project-defined
  module_layout:
    - index.ts
    - manifest.ts
    - routes.ts
    - menu.ts
    - access.ts
    - api/
    - types/
    - composables/
    - pages/
    - components/
    - stores/
    - directives/
    - locales/
    - styles/
    - assets/
    - tests/
  page_layout:
    preferred: kebab-case 目录，内部使用 `index` 页面文件和同目录样式文件
  component_layout:
    preferred: kebab-case 目录，内部使用 `index` 组件文件和同目录样式文件

style_isolation:
  objective: 模块迁移、组合和并行开发后，局部样式不得产生不受控全局污染，隔离策略必须可声明、可验证、可迁移。
  invariant:
    - 每个目标项目必须在 project-scheme.yml 的 style_isolation 中声明 strategy 和 adapter。
    - CSS Modules 是标准 Vite 模板默认策略，不是整个装配系统唯一允许的策略。
    - 模块局部样式必须由当前 strategy 接管；全局主题只能进入项目登记的 global_entrypoints 或 theme 入口。
    - 模块 bundle 必须携带 strategy、adapter、实际使用策略、预处理器和外部全局样式依赖，导入前执行兼容性检查。
  strategies:
    css-modules:
      adapter: builtin-css-modules
      module_file_pattern: '*.module.{css,scss,sass,less,styl,stylus}'
      scoped_name_pattern: 'm_[name]_[local]__[hash:base64:6]'
      vite_plugin_required: false
    vue-scoped:
      adapter: builtin-vue-scoped
      rule: Vue SFC style 必须声明 scoped 或 module；外置普通样式只能通过 `<style scoped src>` 接管。
    utility-css:
      adapter: builtin-utility-css
      rule: 允许无模块样式文件；复杂局部样式默认回退 CSS Modules。
    css-in-js:
      adapter: builtin-css-in-js
      rule: 样式由运行时或编译期 CSS-in-JS 接管；独立局部样式默认仅允许 CSS Modules 回退。
    shadow-dom:
      adapter: builtin-shadow-dom
      rule: 普通样式必须通过带绑定的 `?inline` 或 `?raw` 导入进入 Shadow Root，或回退 CSS Modules。
    hybrid:
      adapter: builtin-hybrid
      rule: 每个样式必须由 CSS Modules、Vue scoped src 或 Shadow DOM inline/raw 中至少一种方式明确接管。
    custom:
      adapter: custom
      rule: custom_adapter 必须位于项目根目录内，当前同步 Gate 只加载显式登记的 CommonJS `.cjs` 适配器。
  naming:
    default_mode: semantic-module-page-feature
    generated_class_pattern: 'm_[name]_[local]__[hash:base64:6]'
    page_owner_pattern: <module-id>-<page-id>.module.<ext>
    semantic_local_pattern: <module><page><feature><role>
    forbidden_generic_locals:
      - page
      - root
      - content
      - container
      - wrapper
      - header
      - footer
      - section
    module_level: styles/<module-id>.module.<ext>
    component_level: <Owner>.module.<ext>
    forbidden_generic_files:
      - index.css
      - index.module.css
      - index.scss
      - index.module.scss
      - index.less
      - index.module.less
  rules:
    - 新项目和新生成页面默认使用 semantic-module-page-feature：owner 文件名至少包含模块与页面，局部类名按模块 + 页面 + 功能 + 角色生成，并在 Gate 中校验跨页面唯一性。
    - 新项目生成模块样式时默认使用 `.module.scss`；旧项目模块样式只有一个后缀时沿用该后缀，出现 css、scss、less、sass、styl、stylus 中任意多个后缀时，新增页面统一生成 `.module.scss`，并把决策记录到 style_isolation.module_style_extension。
    - 旧项目样式后缀探测必须保持只读：不得为统一后缀而迁移、重命名、转换或改写已有样式文件；决策只影响后续新增页面或组件的样式文件后缀。
    - owner 文件名负责源码可追踪；CSS Modules hash、Vue scoped 属性、Shadow Root 或已登记 adapter 负责运行时隔离。
    - 模块局部样式不得定义 :root、html、body、#app 或 #root；全局主题只能进入项目登记的 theme/global_entrypoints。
    - CSS Modules 允许在局部 owner 下使用 :global(...) 覆盖第三方组件，但不得把模块样式退化为全局样式表。
    - utility-css、css-in-js、shadow-dom 默认允许 CSS Modules 作为复杂局部样式 fallback；可通过 local_style_fallback 调整。
    - Tailwind、Ant Design、Element Plus、shared 公共组件和第三方 :global(...) 类名不强制按页面唯一；页面业务 CSS Module 才进入语义命名校验。
    - 旧项目首次接入记录 legacy snapshot；changed 模式只阻断新增或本轮修改引入的违规，不强制一次迁移全部历史样式。
  validation:
    command: node ai-baseline-kit/scripts/style-scope-check.mjs --project-root <project-root>
    adapters: node ai-baseline-kit/scripts/style-scope-check.mjs --list-adapters
    integrated_gate: baseline-check.mjs
    export_guard: 不满足样式隔离契约的模块不得导出为可装配 bundle。

module_contract:
  portability_scope: 同技术栈项目之间应具备直接迁移能力；跨技术栈只复用规则、数据契约和业务协议，不承诺页面组件直接迁移。
  required_files:
    - index.ts
    - manifest.ts
    - routes.ts
    - menu.ts
    - access.ts
  required_directories:
    - pages/
    - components/
    - api/
    - types/
    - stores/
    - locales/
    - styles/
    - assets/
  required_exports:
    index.ts:
      - moduleManifest
      - routes
      - menus
      - access
      - locales
      - stores
      - directives
  manifest_schema:
    required_fields:
      - name
      - version
      - domain
      - routes
      - menus
      - access
      - locales
      - stores
      - directives
      - dependencies
    dependencies:
      shared: []
      base_components: []
      npm: []
      env: []
      assets: []
      permissions: []
  module_namespace:
    rule: 模块 name、路由 name、文案 namespace、store id、样式 class 前缀应保持可追踪一致。
    fix_direction: 使用模块唯一命名空间，避免跨模块和跨项目导入时冲突。

module_boundary_rules:
  - id: module_zero_cross_import
    rule: 模块不得导入其他模块的页面、组件、逻辑、状态、类型、接口、指令、样式或文案。
    fix_direction: 将可复用能力上移到 shared，或把模块私有逻辑保留在所属模块内。
  - id: shared_is_not_module
    rule: shared 可以被 modules 和 shell 使用，但 shared 不得依赖具体模块。
    fix_direction: 移除 shared 对模块的依赖，或拆出真正可共享的抽象。
  - id: static_import_only
    rule: 模块装配只能使用显式静态导入或显式静态注册。
    fix_direction: 用静态注册替代字符串拼接、glob 扫描或运行时路径加载。
  - id: no_hidden_registry
    rule: 模块注册必须集中在明确的装配入口。
    fix_direction: 将零散注册移动到标准路由、文案、状态或指令装配层。
  - id: declared_dependencies_only
    rule: 模块只能依赖 manifest 中显式声明的 shared、base_components、npm、env、assets 和 permissions。
    fix_direction: 将隐式依赖补入 manifest，或移除该依赖，或改为模块内私有实现。
  - id: no_project_private_dependency
    rule: 可迁移模块不得依赖项目私有 shared、项目私有全局变量或未声明的全局上下文。
    fix_direction: 改用 shared-core 或项目标准适配接口；确实不可迁移的依赖必须在 manifest 标记。

page_route_component_rules:
  - 基础入口页和兜底页归属 shell 层。
  - 壳层只提供框架和容器结构，不承载完整业务页本体。
  - 模块页面表达自身业务域，可在模块边界内使用本地组件、逻辑和样式。
  - 组件复用优先进入 shared；基础 UI 封装只进入项目定义的基础组件层。
  - 路由必须指向所属层级的页面文件，不得直接路由到其他模块页面。

api_rules:
  - 模块 API 必须通过项目统一 API client 或统一服务适配层访问。
  - 模块不得自行创建与项目标准冲突的请求实例、拦截器或鉴权逻辑。
  - API 文件应放在模块 `api/` 目录下；跨模块 API 复用必须上移到 shared 或服务协议层。
  - 请求错误处理、鉴权、租户、区域、语言等上下文由项目标准 API client 注入，模块只声明自身接口。

store_rules:
  - 模块私有状态放在模块 `stores/`。
  - 跨模块共享状态放在 shared 或项目定义的共享状态层。
  - 模块不得直接读取另一个模块的 store。
  - 依赖全局用户、权限、租户等上下文时，必须通过项目标准上下文接口或 manifest 依赖声明。

asset_rules:
  - 模块私有图片、图标、模板、静态文件放在模块 `assets/`。
  - 跨模块通用资源放在项目 common assets 层。
  - 模块不得依赖未声明的项目私有静态资源路径。
  - 资源文件命名应带模块或语义前缀，避免导入母版本后冲突。

style_rules:
  - 页面、组件和模块样式优先外置为项目标准样式文件。
  - 不新增与项目无关的新样式语法分支。
  - 样式块仅在必要时作为样式导入口。
  - 页面和组件样式放在所属目录旁。
  - 全局样式只放全局级别内容，不要把页面级业务样式混入全局聚合入口。
  - 可迁移模块只能依赖项目公共设计 token、主题变量或 manifest 声明的样式依赖，不依赖项目私有全局 class。

i18n_rules:
  - 文案分为 shell/global、shared、module、local page/component 等层级。
  - 模块自有文案必须放在模块文案文件中。
  - 全局文案只服务基础层和未迁移的共享旧链路。
  - 模块完成结构迁移后，不得继续把模块业务文案留在全局文案中。
  - 模块迁移必须完成：补齐模块文案，切换模块引用，验证不再依赖全局文案，再清理全局副本。
  - 模块文案必须使用模块命名空间，避免多个项目模块组合后 key 覆盖。

base_component_rules:
  - 基础组件层是 UI 库适配和统一交互协议层，不承载业务模块逻辑。
  - 同技术栈项目要实现模块直接迁移，必须共享同一套基础组件协议，或在 manifest 中声明所需基础组件。
  - 模块不得直接依赖项目私有的基础组件变体，除非 manifest 已明确标记为不可通用依赖。

assembler_contract:
  module_list:
    rule: 母版本只维护显式静态模块列表，不通过运行时字符串拼接或目录扫描装配模块。
  routes:
    input: moduleManifest.routes
    output: project route records
  menus:
    input: moduleManifest.menus
    output: project menu records
  access:
    input: moduleManifest.access
    output: project permission records
  locales:
    input: moduleManifest.locales
    output: merged locale messages by module namespace
  stores:
    input: moduleManifest.stores
    output: registered module stores
  directives:
    input: moduleManifest.directives
    output: registered module directives
  dependencies:
    input: moduleManifest.dependencies
    output: preflight dependency report before module import

naming_rules:
  - 业务目录、页面和局部组件使用 kebab-case。
  - 模块名和功能名保持稳定、清晰、可检索。
  - 避免同一功能区长期混用 PascalCase 与 kebab-case。
  - 基础组件层的内部实现文件可保留组件库风格，但对外命名要统一。

validation_rules:
  - 检查是否存在跨模块直接导入。
  - 检查项目根 AGENTS.md 和 CLAUDE.md 是否包含 ai-baseline 强入口约束。
  - 检查目标项目 .gitignore 是否隐藏 ai-baseline-kit/，并提示移除会遮挡规范包变化的忽略规则。
  - 检查页面是否放在正确层级。
  - 检查新增或重构文件的样式是否外置为项目标准样式文件。
  - 检查文案是否补在所属层。
  - 检查 shared 与基础组件层边界是否混淆。
  - 检查新增依赖是否明确且最小。
  - 检查模块 manifest 是否存在且导出完整。
  - 检查模块依赖是否全部显式声明。
  - 检查模块 assets、styles、locales 是否跟随模块或进入正确共享层。
  - 检查模块是否依赖项目私有 shared、私有全局变量或未声明上下文。
  - 检查模块命名空间是否与已有模块冲突。

portability_checks:
  same_stack_required:
    rule: 页面模块直接迁移只在同技术栈、同装配协议、同基础组件协议项目之间承诺。
  preflight:
    - 读取源项目和目标项目的 baseline-rules.yml
    - 比较 stack、module_contract、assembler_contract、base_component_rules
    - 读取模块 manifest
    - 检查 shared、base_components、npm、env、assets、permissions 依赖
    - 检查命名空间、路由 name、store id、文案 namespace 冲突
    - 输出可迁移、需适配或禁止迁移结论
  migration:
    - 只复制模块目录和 manifest 声明的必要共享依赖
    - 只修改目标项目标准装配入口
    - 不整分支 merge，不整项目 cherry-pick
  verify:
    - 运行 baseline-conformance-skill
    - 运行项目构建、类型检查、单测或等价验证
    - 如失败，按 violations 修复后重新验证

scheme_rules:
  source_of_truth:
    - baseline-rules.yml
    - engineering-workflow.yml
    - module manifests
    - project scheme when present
    - bootstrap scan result when project scheme is missing
  generation:
    - 当前阶段优先由 AI 扫描生成 project-scheme.yml
    - 人只审核或补齐 AI 无法可靠推断的字段
    - 基线完成后再引入自动生成脚本
  usage:
    - AI 先读或生成 scheme，再做迁移判断
    - 人先看 scheme 再审核范围和风险
  not_now:
    - 不在基线未完成时生成执行层脚本
    - 不把 scheme 自动化提前固化为唯一来源

regression_loop_rules:
  max_rounds: 5
  loop:
    - 开发前先结构化需求
    - 只实现限定范围内的改动
    - 运行基线符合性检查
    - 如失败，只修复列出的违规项
    - 重新回归，直到通过或达到最大轮次
  stop_conditions:
    - 结果为 pass
    - 存在无法从仓库上下文安全推断的边界歧义
    - 达到最大轮次后仍重复失败

stack_selection_policy:
  strategy: detect-existing-or-default-new
  precedence:
    - user_explicit_request
    - existing_project_evidence
    - default_new_frontend_profile
    - unknown_with_minimal_questions
  existing_project:
    trigger: package_manifest_or_source_or_build_config_exists
    behavior:
      - preserve_existing_framework_and_toolchain
      - scan_and_record_actual_stack
      - do_not_migrate_or_restructure_automatically
      - develop_new_scope_using_existing_stack
  new_project:
    trigger: no_existing_app_stack_detected
    default_profile: default_new_frontend
    profile_file: docs/stack-profiles.yml
    template_root: templates/react18-antd-tailwind-ts
    default_stack:
      framework: React 18
      ui_library: Ant Design 5
      language: TypeScript
      build_tool: Vite
      router: React Router 6
      style_solution: Tailwind CSS 3
    override_rule: user_explicit_request_wins_before_initialization
  ai_behavior:
    - write_selected_mode_and_evidence_to_project_scheme
    - run_baseline_structure_planning_before_scaffolding
    - do_not_apply_default_template_to_legacy_projects
    - keep_state_manager_and_i18n_project_defined_until_needed

requirement_compilation:
  purpose: 将自然语言、详细大白话、产品文档、API 文档或原型说明转换为可确认、可验收的 Frontend Feature Spec。
  entrypoints:
    skill: skills/requirement-to-feature-spec/SKILL.md
    schema: docs/feature-spec.schema.json
    template: docs/feature-spec.template.json
    compiler: scripts/requirement-compile.mjs
  gates:
    - AI 必须区分文档明确事实、基于证据的推断和未知项。
    - 模块归属、权限、API、路由、状态、危险动作和验收条件存在不确定时，必须写入 requiredQuestions 并向用户提问。
    - Feature Spec 存在 blocking requiredQuestions 或 status 不是 ready 时，禁止生成业务代码。
    - 确定性抽取脚本不能替代大模型对产品语义的理解，也不能把推断当作产品事实。

feature_architecture_plan:
  purpose: 将 ready Feature Spec 和项目地图转换为模块归属、装配点、依赖与文件白名单。
  entrypoints:
    skill: skills/feature-architecture-planner/SKILL.md
    schema: docs/change-plan.schema.json
    planner: scripts/feature-plan.mjs
    generator: scripts/feature-generate.mjs
    module_creator: scripts/module-create.mjs
  decisions:
    - create-module
    - extend-module
    - shared-capability
    - shell-change
  write_boundary:
    - 计划必须列出 create、modify、allowedRoots 和 forbidden。
    - AI 与生成器不得修改 allowedRoots 之外的业务文件。
    - 旧项目装配代码缺少受控标记时，不允许正则猜测改写，必须先向用户确认或由 AI 明确改造装配点。

portable_module_metadata:
  required_file: module.meta.json
  schema: docs/module-meta.schema.json
  purpose: 为模块拆解、组合、迁移和自动审计提供静态机器可读描述；manifest.ts 继续负责运行时装配。
  required:
    - identity and semantic version
    - domain and archetype
    - capabilities
    - public entrypoints
    - shared and npm dependencies
    - permissions
    - portability constraints
    - feature spec provenance
  invariants:
    - dependencies.modules 必须为空。
    - 模块只通过 index.ts 暴露公开能力。
    - 同技术栈迁移前比较 module.meta.json、运行时 manifest 和目标项目装配协议。

design_system:
  reference: docs/design-system.yml
  default_policy: 新 React 项目沿用 Ant Design 5 原生默认 token；Vue 标准模板使用 Element Plus 并沿用其原生默认 CSS variables。
  global_theme_entrypoint: project-scheme.entrypoints.theme
  rules:
    - 每个项目必须登记唯一全局主题变量入口或在 required_questions 中确认创建方案。
    - 项目级颜色、圆角、字号和基础间距优先从全局 CSS 变量读取。
    - 模块不得写死品牌色或复制一套全局 token。
    - 旧项目保留现有 UI 框架和主题，只进行入口登记与增量治理。

legacy_incremental_governance:
  purpose: 旧项目接入时保留历史问题，只阻断接入后的新增违规。
  snapshot: .ai-frontend-assembler/legacy-baseline.json
  schema: docs/legacy-baseline.schema.json
  commands:
    initialize: node ai-baseline-kit/scripts/baseline-check.mjs --write-baseline
    validate_incremental: node ai-baseline-kit/scripts/baseline-check.mjs --mode changed --fail-on-warn
    validate_full: node ai-baseline-kit/scripts/baseline-check.mjs --mode full --fail-on-warn
  rules:
    - project-bootstrap 对首次识别的旧项目创建一次历史快照，重复执行默认保留，不得自动吞并后续新增违规。
    - 只有显式 refresh-legacy-baseline 才能刷新快照，刷新前必须人工审查。
    - 新项目和标准模板使用 full 模式。
    - changed 模式以稳定违规指纹比较历史问题；快照缺失或损坏必须失败。


module_portability_cli:
  workflow:
    - module-export
    - module-compatibility-check
    - module-import
    - project-compose
  safety:
    - 仅自动迁移同技术栈且 modules_root/shared_root 一致的模块。
    - 同名模块、路由冲突、shared hash 冲突、缺失依赖版本或失控装配器必须阻断。
    - 权限、路由、菜单、i18n 通过模块 manifest 和 shell 静态装配器合并。
    - 主题只合并模块真实消费且 bundle 携带定义的 --app-* token。
    - 每次导入生成 docs/module-imports/<module>.json；项目组合生成 docs/project-composition.json。

acceptance_automation:
  module_test_root: tests/
  generated_artifacts:
    - acceptance contract
    - Vitest page-state tests
    - Vitest permission tests
    - Vitest component tests
    - API mock
    - Playwright E2E skeleton
  rules:
    - module.meta.json 与 manifest.dependencies 必须分别声明 npm 运行时依赖和 dev 测试依赖。
    - 生产源码不得只依赖 dependencies.dev。
    - 无法可靠自动推导的自然语言验收行为使用 todo/fixme，不伪造通过。

ast_boundary_check:
  parser_source: target-project
  parsers:
    - TypeScript compiler API
    - Vue compiler-sfc with script fallback
  checks:
    - module 禁止直接依赖 other module
    - shared 禁止依赖 module
    - shell 只能通过 module index 公开入口装配
    - module 禁止依赖 shell 私有实现
    - runtime/test bare imports 必须匹配 module.meta.json dependencies.npm/dev
  fallback:
    - 目标项目未安装 TypeScript 时只记录 info 降级信息。
    - 安装依赖后的验证必须使用 --require-parser。
