        - ai-baseline-kit/scripts/feature-generate.mjs
        - ai-baseline-kit/scripts/module-create.mjs
        - ai-baseline-kit/scripts/ast-boundary-check.mjs
        - ai-baseline-kit/scripts/project-compose.mjs
        - ai-baseline-kit/scripts/module-compatibility-check.mjs
