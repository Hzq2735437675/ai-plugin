        - ai-baseline-kit/scripts/controlled-execution-contract-check.mjs
        - ai-baseline-kit/scripts/smart-compose-contract-check.mjs
        - ai-baseline-kit/scripts/document-normalize.mjs
        - ai-baseline-kit/scripts/smart-develop.mjs
        - ai-baseline-kit/scripts/acceptance-coverage-check.mjs
        - ai-baseline-kit/scripts/intelligent-development-contract-check.mjs
