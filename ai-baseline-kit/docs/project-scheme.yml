modules:
  root: not-applicable-package-repository
  manifest_pattern: not-applicable-package-repository
  items: []

portability:
  same_stack_required: false
  module_copy_unit: ai-baseline-kit directory as an embedded package
  notes:
    - 规范包面向不同技术栈项目提供可迁移的规则和 AI 工作流。
    - 旧项目保留真实技术栈和 UI 框架，不自动套用 React 或 Vue 标准模板。
    - 新项目只提供 React 18 + Vite 与 Vue 3 + Vite + Element Plus 两个内置标准模板。
    - Vue 标准模板通过 unplugin-vue-components 按需导入 Element Plus 组件，默认保留原生配色，并以 src/theme/theme.css 作为唯一项目级主题覆盖入口。
    - 业务模块页面组件不属于本仓库的交付内容。
    - 能力包以独立目录、元数据、入口和安装说明为最小复制单元。

validation:
  typecheck: not-applicable-package-repository
  lint: not-applicable-package-repository
  test: node scripts/package-check.mjs && node ai-baseline-kit/scripts/project-tools-check.mjs && node ai-baseline-kit/scripts/package-upgrade-contract-check.mjs && node ai-baseline-kit/scripts/delivery-closure-contract-check.mjs && node ai-baseline-kit/scripts/baseline-contract-check.mjs && node ai-baseline-kit/scripts/baseline-check.mjs --fail-on-warn
  build: node ai-baseline-kit/scripts/template-build-check.mjs

required_questions: []
confidence: high
evidence:
  - source: ai-baseline-kit/README.md
    finding: ai-baseline-kit 是可完整植入目标项目的 AI 基线规范包，并支持自然语言需求确认、旧项目识别、项目诊断、地图初始化、确定性模块生成和统一验证。
  - source: ai-baseline-kit/plugin.json
    finding: 当前包版本为 0.11.0；目标项目状态已外置，支持整目录替换升级；根 AGENTS.md 与 CLAUDE.md 缺失时创建、已有时安全追加并保持幂等。
  - source: package-registry.json
    finding: 根目录注册表登记当前包、两个标准模板和项目工具，并约定未来包目录为 packages/<package-name>/。
  - source: package-manifest.schema.json
    finding: 所有包的元数据契约要求独立 README、入口和安装说明。
  - source: scripts/package-check.mjs
    finding: 仓库提供无第三方依赖的包结构与元数据检查。
  - source: ai-baseline-kit/scripts/project-doctor.mjs
    finding: 支持识别 Vue、React、Angular、Svelte 等旧项目的框架、构建工具、UI、路由、状态、i18n、样式、模块和验证脚本。
  - source: ai-baseline-kit/scripts/requirement-compile.mjs
    finding: 支持将自然语言或产品文档整理为带阻断式 requiredQuestions 的 Feature Spec。
  - source: ai-baseline-kit/scripts/feature-plan.mjs
    finding: 支持将 ready Feature Spec 转换为带模块归属、文件白名单和装配入口的 Change Plan。
  - source: ai-baseline-kit/scripts/feature-generate.mjs
    finding: 支持 React、Preact 与 Vue 模块的 create-module 和 extend-module 确定性生成，并保持静态装配和显式依赖契约。
  - source: ai-baseline-kit/scripts/module-export.mjs
    finding: 支持生成带技术栈、shared、依赖、主题和文件哈希契约的可迁移模块 bundle。
  - source: ai-baseline-kit/scripts/project-compose.mjs
    finding: 支持校验多个模块 bundle 并组合为标准新项目，输出项目组合清单。
  - source: ai-baseline-kit/scripts/ast-boundary-check.mjs
    finding: 使用目标项目 TypeScript/Vue 解析器构建导入依赖图并检查分层和依赖声明。
  - source: ai-baseline-kit/scripts/document-normalize.mjs
    finding: 将自然语言、结构化文档、OpenAPI、Figma JSON、DOCX 和基础文本型 PDF 标准化；图片、扫描 PDF 或在线 Figma 在缺少外部提取器时阻断确认，不伪造解析结果。
  - source: ai-baseline-kit/scripts/smart-develop.mjs
    finding: 提供统一智能开发入口，串联需求标准化、项目发现、Feature Spec、Change Plan、受控执行、项目验证、有限自动修复与失败回滚，并将审计规格固化到目标项目 docs 目录。
  - source: ai-baseline-kit/scripts/controlled-change-executor.mjs
    finding: 自动修复默认受策略约束且硬上限为三轮，每轮重新计算实际差异，越出文件白名单或允许根目录立即失败并回滚。
  - source: ai-baseline-kit/scripts/acceptance-coverage-check.mjs
    finding: 对 acceptance、页面状态、权限和 API 建立可追踪覆盖清单，并校验项目内 Feature Spec provenance、覆盖清单完整性、测试文件、marker、统计摘要和自动化断言真实性。
  - source: ai-baseline-kit/scripts/delivery-gate.mjs
    finding: 最终 Gate 在实现完整性、AST、项目验证全部通过后生成绑定 request ID 与变更文件哈希的交付回执，失败时不会保留成功回执。
  - source: ai-baseline-kit/scripts/project-tools-lib.mjs
    finding: 统一创建或安全追加根 AGENTS.md 与 CLAUDE.md 的受控入口块，保留项目原规则并保证重复激活幂等。
  - source: ai-baseline-kit/scripts/project-bootstrap.mjs
    finding: 支持生成目标项目地图，并在空目录按指定 profile 初始化 React 或 Vue 标准模板。
  - source: ai-baseline-kit/scripts/project-validate.mjs
    finding: 统一调用基线检查，并按需执行 typecheck、lint、test 和 build。
  - source: ai-baseline-kit/templates/react18-antd-tailwind-ts
    finding: 提供可运行的 React 18 + Vite + Ant Design + Tailwind CSS + TypeScript 默认前端参考模板。
  - source: ai-baseline-kit/templates/vue3-vite-ts
    finding: 提供可运行的 Vue 3 + Vite + Vue Router + Element Plus + TypeScript 标准前端参考模板，组件按需导入并保留 Element Plus 原生默认配色。
  - source: repository-scan
    finding: 当前仓库没有业务源码、路由、状态或业务模块目录；包边界与业务模块边界保持分离。
