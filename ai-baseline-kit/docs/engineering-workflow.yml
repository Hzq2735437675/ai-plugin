purpose: 为 AI 和开发者提供可执行工程化工作流；`baseline-rules.yml` 定义规则，本文件定义不同任务如何按规则落地。

path_mode:
  baseline_root: ai-baseline-kit 目录；规则、skills、scripts 和包参考地图位于此目录内。
  project_root: ai-baseline-kit 的父目录；业务代码、依赖、路由、模块和资源均按此目录扫描或修改。
  embedded_usage: 整包植入项目时，不把 docs/skills/scripts 抽到业务项目根目录；AI 首次接入先补齐项目根 AGENTS.md / CLAUDE.md，再读取 ai-baseline-kit/AGENTS.md。
  capability_routing: 先读取 capabilities/index.json 轻量索引，由 capability-route 只解析命中的显式 manifest；AI 按 load.stages 顺序加载存在文件，不要求用户选择 Skill 或脚本。

principles:
  - 先读规则，再做计划，再实施，再回归。
  - 每次任务都必须限定范围，避免顺手重构。
  - 新增内容必须可定位、可裁剪、可迁移、可回归。
  - 同技术栈项目之间的模块迁移必须先做 preflight，不直接复制或整分支合并。
  - AI 可以负责分析、规划和执行，但人负责审核关键边界、业务语义和最终验收。

required_entrypoints:
  before_work:
    - 项目根 AGENTS.md 和 CLAUDE.md（缺失时由 activate 自动创建）
    - ai-baseline-kit/AGENTS.md 或项目根薄入口
    - ai-baseline-kit/docs/baseline-rules.yml
    - ai-baseline-kit/docs/engineering-workflow.yml
    - .ai-frontend-assembler/project-scheme.yml (target project map, if present)
    - ai-baseline-kit/skills/project-scheme-bootstrap/SKILL.md (if project-scheme.yml missing)
    - ai-baseline-kit/skills/baseline-structure-skill/SKILL.md
  after_work:
    - ai-baseline-kit/skills/baseline-conformance-skill/SKILL.md

workflows:
  bootstrap_existing_project:
    goal: 在旧项目中途接入基线规则，不要求人工预先填写 project-defined。
    steps:
      - 读取 AGENTS.md、baseline-rules.yml 和 engineering-workflow.yml。
      - 使用 project-scheme-bootstrap 扫描 package manifest、框架配置、构建配置、路由、状态、i18n、API client、目录结构、已有模块和验证脚本。
      - 生成 project_root/.ai-frontend-assembler/project-scheme.yml，能确定的字段写入 detected 值，不能确定的字段写 unknown 并列入 required_questions。
      - 不移动旧代码，不做结构重构，只建立项目地图和接入边界。
      - 使用 baseline-conformance-skill 对 scheme 自身做轻量回归。
    output:
      - .ai-frontend-assembler/project-scheme.yml
      - detected stack/layers/entrypoints/modules
      - unknown 字段和最少确认问题
      - 后续改造建议

  bootstrap_new_project:
    goal: 在新项目初始化时接入基线规则，不要求人工预先填写 project-defined。
    steps:
      - 读取 AGENTS.md、baseline-rules.yml 和 engineering-workflow.yml。
      - 如果用户已经说明技术栈，从用户需求中提取 framework、ui_library、language、build_tool、router、state_manager、i18n 和 style_solution。
      - 如果用户明确选择 Vue 3 + Vite，使用默认集成 Element Plus 的内置 `vue3-vite-ts` 模板；如果用户明确选择其他技术栈或其他 Vue UI 框架，按用户选择创建，不套用该默认组合。
      - 如果用户没有说明技术栈且仓库为空，使用内置 `react18-antd-tailwind-ts` 作为默认新前端模板。
      - 如果项目已有依赖或配置，优先从文件推断，并按旧项目模式保留真实技术栈。
      - 使用 project-scheme-bootstrap 生成 project_root/.ai-frontend-assembler/project-scheme.yml 初版。
      - 首次接入时建立构建隔离：保持 ai-baseline-kit 可被 Git 审计，同时写入部署 ignore、npm 嵌套排除和 postbuild 产物守卫。
      - 在 scheme 中记录 shell/shared/modules、基础组件层、API client、路由、状态、i18n、样式方案、style_isolation strategy/adapter 和验证命令；CSS Modules 是标准默认值，不覆盖旧项目已验证的 scoped、utility、CSS-in-JS 或 Shadow DOM 策略。
      - 后续新增页面或模块必须先经过 baseline-structure-skill。
    output:
      - .ai-frontend-assembler/project-scheme.yml
      - 新项目基线落点
      - 缺失决策的最少问题

  new_feature:
    goal: 在新项目或已基线化项目中新增功能。
    steps:
      - 读取 baseline-rules.yml 和本 workflow。
      - 如果 .ai-frontend-assembler/project-scheme.yml 不存在，先运行 bootstrap_existing_project 或 bootstrap_new_project。
      - 使用 baseline-structure-skill 输出目标层级、模块、页面、路由、组件、API、状态、文案、样式、资源、manifest、依赖和验证计划。
      - 只在目标模块或目标共享层内新增文件。
      - 模块局部样式必须由项目地图登记的 style_isolation strategy/adapter 接管；Vite 标准模板默认生成 `styles/<module-id>.module.css`，其他项目按 vue-scoped、utility-css、css-in-js、shadow-dom、hybrid 或 custom adapter 验证。
      - 为模块补齐 manifest、routes、menus、access、locales、stores、assets 和 dependencies。
      - 使用静态装配入口接入模块，不新增隐式注册点。
      - 运行 baseline-conformance-skill。
    output:
      - 结构化开发方案
      - 完整模块或功能改动
      - 回归结果 pass/fail

  refactor_existing_page:
    goal: 在不改变业务行为的前提下，把已有页面整理到基线结构。
    steps:
      - 如果 .ai-frontend-assembler/project-scheme.yml 不存在，先运行 bootstrap_existing_project。
      - 明确只改一个页面或一个小模块。
      - 盘点页面依赖的组件、API、状态、文案、样式、资源和路由。
      - 区分页面私有内容、模块内容、shared 内容和基础组件内容。
      - 将页面私有内容收敛到页面目录，将模块内容收敛到模块目录。
      - 外置样式，补齐文案命名空间，消除跨模块直接引用。
      - 更新 manifest 和装配入口。
      - 运行 baseline-conformance-skill。
    output:
      - 页面依赖清单
      - 基线化后的页面模块结构
      - 回归结果 pass/fail

  modularize_legacy_page:
    goal: 将旧项目中的单个页面整理成可移植模块资产。
    steps:
      - 如果 .ai-frontend-assembler/project-scheme.yml 不存在，先运行 bootstrap_existing_project。
      - 锁定页面入口、路由、菜单和业务边界。
      - 追踪页面直接依赖和必要间接依赖。
      - 将页面、子组件、API、types、stores、locales、styles、assets 归入模块目录。
      - 将真正跨模块复用能力上移到 shared；不要把页面私有逻辑放入 shared。
      - 为模块补齐 manifest，并声明 shared、base_components、npm、env、assets、permissions 依赖。
      - 运行 baseline-conformance-skill，确认模块可被独立复制。
    output:
      - 可移植模块目录
      - manifest 依赖声明
      - 迁移前置风险列表

  migrate_module_between_projects:
    goal: 在同技术栈、同装配协议项目之间迁移模块。
    preflight:
      - 读取源项目和目标项目的 baseline-rules.yml。
      - 比较 framework、ui_library、build_tool、router、state_manager、i18n、style_solution。
      - 比较 module_contract、assembler_contract、base_component_rules。
      - 读取源模块 manifest。
      - 检查 shared、base_components、npm、env、assets、permissions 依赖。
      - 检查命名空间、路由 name、store id、文案 namespace 冲突。
      - 输出 can_migrate / needs_adapter / blocked。
    steps:
      - 只复制模块目录和 manifest 声明的必要共享依赖。
      - 只修改目标项目标准装配入口。
      - 不整分支 merge，不整项目 cherry-pick。
      - 运行 baseline-conformance-skill。
      - 运行目标项目构建、类型检查、单测或等价验证。
    output:
      - preflight 结论
      - 迁移文件清单
      - 装配入口变更清单
      - 回归结果 pass/fail

  initialize_new_project:
    goal: 使用公司基线初始化一个同技术栈新项目。
    steps:
      - 固定技术栈、构建工具、路由、状态、i18n、样式方案、UI 基础组件协议。
      - 创建 shell、shared、modules、base components、common assets 等项目根结构。
      - 将完整 ai-baseline-kit/ 放入项目根目录；不要把 docs、skills、scripts 抽散到业务项目根目录。
      - 如需自动发现规范包，可在项目根目录放置分发目录同级的 AGENTS.md 和 CLAUDE.md 薄入口。
      - 不自动修改项目根 .gitignore；保留 ai-baseline-kit/ 的 Git 可见性，便于审计和同步规范包变化。
      - 使用 project-scheme-bootstrap 生成 project_root/.ai-frontend-assembler/project-scheme.yml 初版。
      - 建立构建隔离并确认 ai-baseline-kit/ 与 .ai-frontend-assembler/ 不进入发布产物。
      - 建立统一 API client、权限上下文、模块装配器、文案装配器、状态装配器。
      - 生成示例模块，验证 manifest 和装配链路。
      - 跑 baseline-conformance-skill 和项目基础构建。
    output:
      - 新项目骨架
      - 示例模块
      - 基础回归结果

  regression:
    goal: 对任意实现或迁移结果做基线回归。
    steps:
      - 如果 project_root/.ai-frontend-assembler/project-scheme.yml 不存在，先运行 project-scheme-bootstrap 并生成项目地图。
      - 使用 baseline-conformance-skill 检查层级、边界、manifest、API、状态、资源、文案、样式、命名和依赖。
      - 运行项目要求的构建、类型检查、单测或等价验证。
      - 构建完成后运行 build-artifact-guard --check，确认输出目录无 ai-baseline-kit/ 与 .ai-frontend-assembler/。
      - 输出 pass/fail、violations、required_fixes、rerun、verify。
    output:
      - 回归报告

  fix_verify_loop:
    goal: 失败后只修复违规项并重新验证。
    max_rounds: 5
    steps:
      - 只修复 violations 中列出的内容。
      - 不扩大任务范围，不做顺手重构。
      - 每轮修复后重新运行相同检查。
      - 达到 max_rounds 仍失败时停止，并说明阻塞原因。
    stop_conditions:
      - pass
      - 规则歧义需要人确认
      - 达到最大轮次


  requirement_document_to_feature:
    goal: 将任意自然语言或产品文档转为可确认的前端功能规格。
    steps:
      - 使用 requirement-to-feature-spec 完整读取用户输入和上传文档。
      - 区分 explicit、inferred、unknown。
      - 生成 docs/features/<feature-id>.feature.json。
      - 对模块、权限、API、路由、状态和验收缺口向用户提出最少确认问题。
      - requiredQuestions 清零并由用户确认后将 status 改为 ready。
    stop_conditions:
      - 产品文档无法读取或内容缺失。
      - 存在 blocking requiredQuestions。
    output:
      - ready Feature Spec 或用户确认问题

  feature_spec_to_modular_code:
    goal: 从 ready Feature Spec 生成强模块边界的项目文件。
    steps:
      - 使用 feature-architecture-planner 生成 change plan。
      - 决定 create-module、extend-module、shared-capability 或 shell-change。
      - 固定 files.allowedRoots 和 files.forbidden。
      - 对标准 React/Vue 模块运行 feature-generate；不受支持的框架由 AI 按同一计划实现。
      - 更新 project-scheme 和 module.meta.json。
      - 运行 baseline conformance、类型检查、测试和构建。
    output:
      - 模块代码
      - module.meta.json 与 manifest.ts
      - 静态装配变更
      - 验收与验证报告

  onboard_legacy_incrementally:
    goal: 旧项目接入基线后只阻断新增违规。
    steps:
      - 运行 project-bootstrap 识别真实技术栈和边界。
      - 首次接入创建 .ai-frontend-assembler/legacy-baseline.json；之后默认保留快照。
      - 日常验证使用 baseline-check --mode changed。
      - 新增或修改模块仍必须满足完整模块契约。
      - 历史治理按模块逐步清理，清理后人工刷新快照。
    output:
      - 旧项目地图
      - 历史违规快照
      - 新增违规阻断结果

  replace_package_upgrade:
    goal: 在不丢失目标项目状态的前提下直接替换 ai-baseline-kit/。
    steps:
      - 保留 project_root/.ai-frontend-assembler/、AGENTS.md、CLAUDE.md 和业务代码。
      - 用最新 ai-baseline-kit/ 整目录替换旧目录。
      - 运行 node ai-baseline-kit/scripts/ai-run.mjs upgrade，只迁移/校验状态和入口，不重建项目地图、不刷新旧项目快照。
      - 运行 ai-run gate 或 project-validate 完成升级回归。
    compatibility:
      - 0.10.0+ 已接入项目可直接替换。
      - 0.9.x 及更早项目必须在删除旧包内项目专属文件前完成一次迁移。

ai_readability:
  required_artifacts:
    - baseline-rules.yml 用于机器读取规则。
    - engineering-workflow.yml 用于机器选择任务流程。
    - .ai-frontend-assembler/project-scheme.yml 用于机器读取当前项目地图。
    - module manifest 用于机器识别模块能力和依赖。
    - conformance report 用于机器进入修复到验证闭环。
  design_intent:
    - 让 AI 少猜测，多按结构字段执行。
    - 让模块迁移先判断，再执行。
    - 让人审核计划、依赖、风险和最终结果。

module_composition_workflow:
  export:
    - 读取 module.meta.json、manifest、shared 契约、npm/dev 版本、路由、权限、主题 token 和 styleIsolation strategy/adapter。
    - 生成带 SHA-256 文件清单的 module-bundle.json。
  compatibility:
    - 校验技术栈、目录根、同名模块、路由、shared hash、依赖、主题、样式隔离策略/预处理器和静态装配器。
    - blockers 非空时不得导入。
  import:
    - 只执行兼容性报告中的受控动作。
    - 更新依赖、缺失 shared、主题 token、module assembler 和导入回执。
  compose:
    - 先校验 bundle 集合内部的模块名、路由和 shared 冲突。
    - 空目录按显式 stack 初始化标准模板，再逐模块导入。
    - 输出 docs/project-composition.json。

acceptance_test_workflow:
  source: Feature Spec acceptance/pages/permissions/api
  active_assertions:
    - contract completeness
    - page state declaration
    - permission coverage
    - generated page ready state
  deferred_assertions:
    - 无法从自然语言确定实现细节的业务行为转为 blocking question；未经用户确认不得进入交付。
    - 仅在用户明确接受延期时允许 `ai-baseline:approved-incomplete`，并记录剩余风险。
  validation:
    - npm run test
    - npm run typecheck
    - Playwright 配置和 E2E 文件进入类型检查；浏览器执行按项目 CI 环境启用。

delivery_closure:
  command: scripts/delivery-gate.mjs
  required: true
  checks:
    - implementation-completeness-check.mjs
    - ast-boundary-check.mjs --require-parser（除非显式记录 allow-parser-fallback）
    - project-validate.mjs
    - ci-gate.mjs
  receipt: .ai-frontend-assembler/deliveries/<request-id>.delivery.json
  completion_lock:
    - status 必须为 passed
    - checks.finalGate 必须为 passed
    - changedFilesHash 必须存在且能复核当前文件
    - 无有效回执时 AI 不得声明已完成或可交付

ast_boundary_workflow:
  before_install: 允许明确降级为 info。
  after_install: ast-boundary-check.mjs --require-parser。
  output: files、edges、parser mode 和 violations 组成可审计依赖图报告。


intelligent_development_closed_loop:
  unified_entry:
    command: scripts/smart-develop.mjs
    inputs:
      - natural-language
      - product-document
      - api-document
      - figma-json
      - ready-feature-spec
    routing:
      create-project: 显式创建模式，在临时模板上规划后进入受控事务。
      modify-feature: 旧项目增量模式，目标必须存在 package.json。
      repair-project: 在原项目和原文件边界内修复并验证。
      compose-project: 自动委托 smart-compose，不要求使用者选择底层命令。
    gates:
      - 文档标准化状态必须为 ready。
      - Feature Spec 和 Change Plan 必须为 ready 且无 blocking questions。
      - Change Plan 必须固定 files.allowedRoots 和 files.forbidden。
      - 所有实际写入必须由 controlled-change-executor 执行。

  document_normalization:
    command: scripts/document-normalize.mjs
    built_in:
      - text / markdown / rst / csv / yaml
      - html text extraction
      - json / OpenAPI JSON / Figma JSON
      - DOCX document.xml
      - basic text-based PDF Tj/TJ streams
    adapters:
      cli: --extractor <node-script>
      environment: AI_BASELINE_DOCUMENT_EXTRACTOR
    safety:
      - 图片、扫描 PDF、在线 Figma 和未知二进制格式没有适配器时阻断。
      - 提取为空、解析失败或内容不可可靠读取时输出 blocking question。
      - 不把空内容、乱码、推测文本当作产品需求。

  controlled_repair:
    default_attempts: 2
    hard_max_attempts: 3
    rules:
      - 每轮修复沿用同一 ready Feature Spec 和 Change Plan。
      - 每轮修复后重新计算实际 diff 并检查白名单和禁止路径。
      - 修复不得扩大 allowedRoots，不得刷新 legacy snapshot 掩盖新增违规。
      - 验证通过后提交事务；越界、失败或耗尽次数后回滚。
    audit:
      - smart-develop-run.json
      - controlled-execution.json
      - target-project/docs/features/<feature>.feature.json
      - target-project/docs/changes/<feature>.change-plan.json

  acceptance_coverage:
    command: scripts/acceptance-coverage-check.mjs
    manifest: modules/<module>/tests/<feature>.acceptance-coverage.json
    required_types:
      - acceptance
      - page-state
      - permission
      - api
    hard_checks:
      - 每个覆盖项必须有唯一 id、marker 和至少一个真实测试文件。
      - 引用文件必须位于模块 tests 根内并包含 marker。
      - Feature Spec provenance 必须位于项目内，且每个来源特性必须存在对应覆盖清单。
      - summary total、mapped、automated 和百分比必须与实际映射一致。
      - 无法从需求可靠推导的行为断言必须 todo/fixme，不得计为伪造的行为通过。
