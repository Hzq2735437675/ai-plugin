# 内置标准模板只覆盖两个新前端选择；旧项目不套模板，只保留真实技术栈。
profiles:
  default_new_frontend:
    id: react18-antd-tailwind-ts
    name: React 18 + Vite + Ant Design + Tailwind CSS + TypeScript
    status: active
    selection:
      mode: new-project
      when: project_root_has_no_existing_app_stack_and_user_did_not_choose_a_stack
      user_override: allowed-before-initialization
    stack:
      framework: React 18
      ui_library: Ant Design 5
      language: TypeScript
      build_tool: Vite
      router: React Router 6
      state_manager: project-defined
      i18n: project-defined
      style_solution: Tailwind CSS 3 + CSS Modules
    style_isolation:
      strategy: css-modules
      adapter: builtin-css-modules
      supported_strategies: css-modules,utility-css,css-in-js,shadow-dom,hybrid,custom
      local_style_fallback: none
    template_root: templates/react18-antd-tailwind-ts
    theme_entrypoint: src/theme/theme.css
    theme_adapter: src/theme/antd-theme.ts
    required_outputs:
      - package.json
      - src/app
      - src/shared
      - src/modules
      - src/main.tsx
    validation:
      install: npm install
      test: npm run test
      ast_boundary: node ai-baseline-kit/scripts/ast-boundary-check.mjs --require-parser
      typecheck: npm run typecheck
      build: npm run build
    notes:
      - 该 profile 只用于新项目初始化，不覆盖已有项目技术栈。
      - state_manager 和 i18n 在未提出需求时保持 project-defined，不凭空增加全局复杂度。
      - 模块局部样式使用 Vite 内置 CSS Modules，文件按 owner 命名为 `Owner.module.<ext>`，不新增样式唯一化插件。

  vue3_vite:
    id: vue3-vite-ts
    name: Vue 3 + Vite + Element Plus + TypeScript
    status: active
    selection:
      mode: new-project
      when: user_explicitly_chooses_vue_3_and_vite_before_initialization
      user_override: required-selection
    stack:
      framework: Vue 3
      ui_library: Element Plus
      language: TypeScript
      build_tool: Vite
      router: Vue Router 4
      state_manager: project-defined
      i18n: project-defined
      style_solution: Element Plus CSS variables + CSS Modules
    style_isolation:
      strategy: css-modules
      adapter: builtin-css-modules
      supported_strategies: css-modules,vue-scoped,utility-css,css-in-js,shadow-dom,hybrid,custom
      local_style_fallback: none
    template_root: templates/vue3-vite-ts
    theme_entrypoint: src/theme/theme.css
    theme_adapter: Element Plus CSS variables in src/theme/theme.css
    component_import: unplugin-vue-components + ElementPlusResolver
    required_outputs:
      - package.json
      - src/app
      - src/shared
      - src/modules
      - src/main.ts
    validation:
      install: npm install
      test: npm run test
      ast_boundary: node ai-baseline-kit/scripts/ast-boundary-check.mjs --require-parser
      typecheck: npm run typecheck
      build: npm run build
    notes:
      - 该 profile 只用于用户明确选择 Vue 3 + Vite 的新项目。
      - Element Plus 是该标准模板的默认 UI library；state_manager、i18n 和 API client 按项目需求显式选择。
      - Element Plus 组件通过 unplugin-vue-components + ElementPlusResolver 按需导入，JavaScript API 保持显式 import。
      - 默认保留 Element Plus 原生配色，项目级覆盖只允许进入 src/theme/theme.css。
      - 用户初始化前明确指定其他 Vue UI 框架时，用户选择优先。
      - 模块局部样式使用 Vite 内置 CSS Modules，文件按 owner 命名为 `Owner.module.<ext>`，不新增样式唯一化插件。

  existing_project_detected:
    id: existing-project-detected
    name: Existing project stack detected
    status: policy
    selection:
      mode: legacy-project
      when: package_manifest_or_source_or_build_config_exists
      user_override: not-required
    behavior:
      - 读取已有 package manifest、lockfile、构建配置、入口、路由、状态、i18n 和模块目录。
      - 保留已有 framework、ui_library、language、build_tool、router、state_manager、i18n、style_solution 和已验证的 style_isolation strategy/adapter。
      - 旧项目即使使用 Vue、React、Angular、Svelte 或其他框架，也不自动复制两个标准模板。
      - 只生成或更新 project-scheme.yml，不自动重构旧代码或切换技术栈。
      - 新增能力遵循旧项目真实技术栈和基线分层规则。
      - 首次接入写入 legacy baseline snapshot；日常验证使用 changed 模式，只阻断新增违规。
      - 历史快照不得在普通功能开发中刷新；只有明确治理历史债务或重新建立基线时才允许更新。
      - 保留旧项目已有主题；若主题入口无法识别，必须向用户确认后再新增或登记全局主题文件。

standard_templates:
  only:
    - id: react18-antd-tailwind-ts
      path: templates/react18-antd-tailwind-ts
      role: default-new-frontend
    - id: vue3-vite-ts
      path: templates/vue3-vite-ts
      role: explicit-vue3-vite-choice
  not_included:
    - Next.js
    - Nuxt
    - Angular
    - Svelte
